<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employees CRUD</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding: 1.5rem; }
    .pointer { cursor: pointer; }
  </style>
</head>
<body>
<div class="container">
  <h1 class="mb-4">Employees CRUD</h1>

  <div id="alert-placeholder"></div>

  <div class="card mb-4">
    <div class="card-body">
      <form id="employee-form">
        <input type="hidden" id="employee-id">
        <div class="row g-3">
          <div class="col-md-5">
            <label for="employee-name" class="form-label">Name</label>
            <input id="employee-name" class="form-control" required>
          </div>
          <div class="col-md-5">
            <label for="employee-dept" class="form-label">Department</label>
            <input id="employee-dept" class="form-control" required>
          </div>
          <div class="col-md-2 d-flex align-items-end">
            <button id="save-btn" type="submit" class="btn btn-primary w-100">Save</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <h5 class="card-title">Employees</h5>
      <div class="table-responsive">
        <table class="table table-striped" id="employees-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Department</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
const baseUrl = '/api/employees';

function showAlert(message, type = 'success') {
  const placeholder = document.getElementById('alert-placeholder');
  placeholder.innerHTML = `\
    <div class="alert alert-${type} alert-dismissible" role="alert">\
      ${message}\
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>\
    </div>`;
  setTimeout(() => { placeholder.innerHTML = ''; }, 4000);
}

async function fetchEmployees() {
  try {
    const res = await fetch(baseUrl);
    if (!res.ok) throw new Error('Failed to fetch employees');
    const list = await res.json();
    populateTable(list);
  } catch (err) {
    showAlert(err.message, 'danger');
    console.error(err);
  }
}

function populateTable(list) {
  const tbody = document.querySelector('#employees-table tbody');
  tbody.innerHTML = '';
  list.forEach(emp => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${emp.id ?? ''}</td>
      <td>${escapeHtml(emp.name ?? '')}</td>
      <td>${escapeHtml(emp.department ?? '')}</td>
      <td>
        <button class="btn btn-sm btn-outline-secondary me-2" onclick="onEdit(${emp.id})">Edit</button>
        <button class="btn btn-sm btn-outline-danger" onclick="onDelete(${emp.id})">Delete</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function escapeHtml(unsafe) {
  return unsafe
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/\"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

async function onEdit(id) {
  try {
    const res = await fetch(`${baseUrl}/${id}`);
    if (!res.ok) throw new Error('Employee not found');
    const emp = await res.json();
    document.getElementById('employee-id').value = emp.id || '';
    document.getElementById('employee-name').value = emp.name || '';
    document.getElementById('employee-dept').value = emp.department || '';
    document.getElementById('save-btn').textContent = 'Update';
  } catch (err) {
    showAlert(err.message, 'danger');
    console.error(err);
  }
}

async function onDelete(id) {
  if (!confirm('Delete employee id=' + id + '?')) return;
  try {
    const res = await fetch(`${baseUrl}/${id}`, { method: 'DELETE' });
    if (res.status === 204 || res.ok) {
      showAlert('Deleted employee id=' + id, 'info');
      fetchEmployees();
      resetForm();
    } else {
      throw new Error('Failed to delete');
    }
  } catch (err) {
    showAlert(err.message, 'danger');
    console.error(err);
  }
}

function resetForm() {
  document.getElementById('employee-id').value = '';
  document.getElementById('employee-name').value = '';
  document.getElementById('employee-dept').value = '';
  document.getElementById('save-btn').textContent = 'Save';
}

document.getElementById('employee-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const id = document.getElementById('employee-id').value;
  const name = document.getElementById('employee-name').value.trim();
  const department = document.getElementById('employee-dept').value.trim();

  if (!name || !department) {
    showAlert('Name and department are required', 'warning');
    return;
  }

  try {
    const payload = { name, department };
    let res;
    if (id) {
      res = await fetch(`${baseUrl}/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error('Failed to update employee');
      const updated = await res.json();
      showAlert('Updated employee id=' + updated.id, 'success');
    } else {
      res = await fetch(baseUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (res.status !== 201 && !res.ok) throw new Error('Failed to create employee');
      const created = await res.json();
      showAlert('Created employee id=' + created.id, 'success');
    }
    fetchEmployees();
    resetForm();
  } catch (err) {
    showAlert(err.message, 'danger');
    console.error(err);
  }
});

// initial load
fetchEmployees();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
