# Verified sender required by SendGrid (must be configured in your SendGrid account)
app.mail.from=sendingtoplan@gmail.com

# Jasypt configuration: read encryptor password from env var JASYPT_ENCRYPTOR_PASSWORD
# Make sure to set this in your runtime environment (Render environment variable or -Djasypt.encryptor.password)
