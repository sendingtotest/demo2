<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Users Info</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700&display=swap" rel="stylesheet">
    <style>
        body {
            background: #f7fafc;
            font-family: 'Roboto', Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 32px 24px 24px 24px;
        }
        h1 {
            color: #2d3748;
            margin-bottom: 8px;
        }
        p {
            color: #4a5568;
            margin-bottom: 24px;
        }
        h2 {
            text-align: center;
            color: #2b6cb0;
            margin-top: 32px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            margin: 20px 0;
            background: #f9fafb;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            border: 1px solid #e2e8f0;
            padding: 10px 12px;
            text-align: left;
        }
        th {
            background: #ebf8ff;
            color: #2b6cb0;
        }
        tr:hover {
            background: #e6fffa;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 0 auto 24px auto;
            max-width: 400px;
            background: #f1f5f9;
            padding: 20px 16px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(44,62,80,0.04);
        }
        label {
            display: flex;
            flex-direction: column;
            font-weight: 500;
            color: #2d3748;
        }
        input[type="text"], input[type="email"] {
            padding: 8px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            margin-top: 4px;
            font-size: 1em;
        }
        button {
            background: #3182ce;
            color: #fff;
            border: none;
            padding: 10px 0;
            border-radius: 4px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }
        button:hover {
            background: #2b6cb0;
        }
        .success {
            color: #38a169;
            text-align: center;
            margin-bottom: 12px;
        }
        .error {
            color: #e53e3e;
            text-align: center;
            margin-bottom: 12px;
        }
        /* Delete button specific styles */
        .delete-btn {
            background: #e53e3e;
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        .delete-btn:hover {
            background: #c53030;
        }
        .actions-cell {
            text-align: center;
        }
        /* Make disabled delete buttons visually greyed-out and unclickable */
        .delete-btn:disabled {
            background: #cbd5e1; /* light gray */
            color: #718096; /* slate gray text */
            cursor: not-allowed;
            opacity: 0.9;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="text-align:center;">
            <h1>Who wants to come to smokies trip?</h1>
            <p>Please register with your name and email below to join userlist and the trip plan!</p>
        </div>
        <form id="userForm">
            <h3 style="text-align:center; color:#2b6cb0;">Add User</h3>
            <div id="formMessage"></div>
            <label>Name:
                <input type="text" id="name" required placeholder="Enter your name">
            </label>
            <label>Email:
                <input type="email" id="email" required placeholder="Enter your email">
            </label>
            <button type="submit">Register</button>
        </form>
        <h2>User List</h2>
        <div id="tableMessage"></div>
        <table id="usersTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- User rows will be inserted here -->
            </tbody>
        </table>
    </div>
    <script>
        function clearMessages() {
            const formMessage = document.getElementById('formMessage');
            const tableMessage = document.getElementById('tableMessage');
            formMessage.textContent = '';
            formMessage.className = '';
            tableMessage.textContent = '';
            tableMessage.className = '';
        }

        function loadUsers() {
            fetch('/api/users')
                .then(response => response.json())
                .then(users => {
                    const tbody = document.querySelector('#usersTable tbody');
                    tbody.innerHTML = '';
                    users.forEach(user => {
                        const row = document.createElement('tr');
                        row.innerHTML = `<td>${user.id}</td><td>${user.name}</td><td>${user.email}</td><td class="actions-cell"><button class="delete-btn" data-id="${user.id}">Delete</button></td>`;
                        tbody.appendChild(row);
                    });
                })
                .catch(err => {
                    console.error('Error loading users:', err);
                    const tableMessage = document.getElementById('tableMessage');
                    tableMessage.textContent = 'Failed to load users.';
                    tableMessage.className = 'error';
                });
        }
        window.onload = loadUsers;

        document.getElementById('userForm').onsubmit = function(e) {
            e.preventDefault();
            clearMessages();
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const messageDiv = document.getElementById('formMessage');
            fetch('/api/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email })
            })
            .then(response => {
                if (response.ok) {
                    loadUsers();
                    document.getElementById('userForm').reset();
                    messageDiv.textContent = 'Registration successful! Please check your email for trip details.';
                    messageDiv.className = 'success';
                } else {
                    response.text().then(text => {
                        messageDiv.textContent = text || 'Failed to add user. Please try again.';
                        messageDiv.className = 'error';
                    });
                }
            })
            .catch(err => {
                console.error('Error creating user:', err);
                messageDiv.textContent = 'Failed to add user. Please try again.';
                messageDiv.className = 'error';
            });
        };

        // Event delegation for delete buttons
        document.querySelector('#usersTable tbody').addEventListener('click', function(e) {
            if (e.target && e.target.matches('button.delete-btn')) {
                const id = e.target.dataset.id;
                if (!id) return;
                if (!confirm('Are you sure you want to delete this user?')) return;
                // disable button while request is in flight
                e.target.disabled = true;
                fetch('/api/users/' + id, { method: 'DELETE' })
                    .then(response => {
                        if (response.ok) {
                            loadUsers();
                            const tableMessage = document.getElementById('tableMessage');
                            tableMessage.textContent = 'User deleted successfully.';
                            tableMessage.className = 'success';
                        } else {
                            return response.text().then(text => { throw new Error(text || 'Delete failed'); });
                        }
                    })
                    .catch(err => {
                        console.error('Error deleting user:', err);
                        const tableMessage = document.getElementById('tableMessage');
                        tableMessage.textContent = 'Failed to delete user: ' + err.message;
                        tableMessage.className = 'error';
                    })
                    .finally(() => {
                        e.target.disabled = false;
                    });
            }
        });
    </script>
</body>
</html>
